# User Settings for Hyprland
general {
    # Active Border: Bright Red
    col.active_border = rgba(ff0000ff) 

    # Inactive Border: Dark Red
    col.inactive_border = rgba(880000ff)

    border_size = 2
    layout = dwindle
}

# Optional: Set Gaps
general {
    gaps_in = 5
    gaps_out = 10
}
input {
    kb_layout = us
    kb_options = 
}
xwayland {
    force_zero_scaling = true
}
